<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project · Roi Maynar Nieto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Germania+One&family=Lusitana:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav><div class="wrap">
  <b><a href="index.html#contacto" style="text-decoration:none">ROI MAYNAR NIETO</a></b>
  <ul>
    <li><a href="index.html#trabajo">Work</a></li>
    <li><a href="index.html#contacto">Contact</a></li>
  </ul>
</div></nav>

<main class="wrap proj" id="proj"></main>

<footer><div class="wrap">© <span id="yr"></span> Roi Maynar Nieto</div></footer>

<script src="projects.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const i=P.findIndex(p=>p.id===id), p=P[i], root=document.getElementById('proj');
document.getElementById('yr').textContent=new Date().getFullYear();
if(!p){
  root.innerHTML='<a class="back-link" href="index.html#trabajo">← Back to work</a><h1>Not found</h1><p>This project does not exist.</p>';
}else{
  document.title=p.t+' · Roi Maynar Nieto';
  const prev=P[(i-1+P.length)%P.length], next=P[(i+1)%P.length];
  const gal=p.gallery&&p.gallery.length
    ? p.gallery.map(g=>`<figure><img src="${esc(g.src)}" alt="${esc(g.cap||p.t)}" loading="lazy">${g.cap?`<figcaption>${esc(g.cap)}</figcaption>`:''}</figure>`).join('')
    : [1,2].map(()=>`<figure><div class="ph"><div class="plate"><div class="wiz w-${p.c==='juegos'?'cfx':p.c}"></div></div></div><figcaption>Add your images here (gallery field in projects.js)</figcaption></figure>`).join('');
  root.innerHTML=`
    <a class="back-link" href="index.html#trabajo">← Back to work</a>
    <h1>${esc(p.t)}</h1>
    <ul class="meta"><li>${CATS[p.c]}</li><li>${p.y}</li><li>${esc(p.tools)}</li></ul>
    <p class="lead">${esc(p.intro||p.d)}</p>
    ${p.vimeo?`<div class="proj-video"><iframe src="https://player.vimeo.com/video/${esc(p.vimeo)}?title=0&byline=0&portrait=0" allow="fullscreen; picture-in-picture" allowfullscreen title="${esc(p.t)}"></iframe></div>`:''}
    <div class="proj-text">${(p.text||[]).map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    <div class="gallery">${gal}</div>
    <div class="pager">
      <a class="btn" href="proyecto.html?id=${encodeURIComponent(prev.id)}">← ${esc(prev.t)}</a>
      <a class="btn" href="proyecto.html?id=${encodeURIComponent(next.id)}">${esc(next.t)} →</a>
    </div>`;
}
</script>
</body>
</html>
